<div align="center">

    <h1>User Registration</h1>
    <h3 style="color: red;">{{form.errorMsg}}</h3>
    <form (submit)="signUp()">
        <table>
            <tr>
                <th>First Name</th>
                <td><input type="text" name="firstName" [(ngModel)]="form.firstName"
                        placeholder="Enter your first name"></td>
            </tr>
            <tr>
                <th>Last Name</th>
                <td><input type="text" name="lastName" [(ngModel)]="form.lastName" placeholder="Enter your last name">
                </td>
            </tr>
            <tr>
                <th>Login</th>
                <td><input type="text" name="login" [(ngModel)]="form.login" placeholder="Enter your loginId"></td>
            </tr>
            <tr>
                <th>Password</th>
                <td><input type="password" name="Password" [(ngModel)]="form.password"
                        placeholder="Enter your password"></td>
            </tr>
            <tr>
                <th>Date of birth</th>
                <td><input type="date" name="dob" [(ngModel)]="form.dob" placeholder="Enter your date of birth"></td>
            </tr>
            <tr>
                <th></th>
                <td><input type="submit" value="signup"></td>
            </tr>
        </table>
    </form>
</div>
