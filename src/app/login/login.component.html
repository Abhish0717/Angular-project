<div align="center">

    <h1>Login</h1>
    <h3 style="color: red;">{{form.errorMsg}}</h3>
    <form (submit)="signIn()">
        <table>
            <tr>
                <th>Login</th>
                <td><input type="text" name="login" [(ngModel)]="form.data.login" placeholder="Enter your login"></td>
                <td style="color: red;">{{form.inputerror.login}}</td>
            </tr>
            <tr>
                <th>Password</th>
                <td><input type="password" name="password" [(ngModel)]="form.data.password" placeholder="Enter your password">
                </td>
                <td style="color: red;">{{form.inputerror.password}}</td>
            </tr>
            <tr>
                <th></th>
                <td><input type="submit" value="signin"> &nbsp;
                    <button (click)="signUp()">signup</button>
            </tr>
        </table>
    </form>
</div>
